name: CI

on:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # PostgreSQL efímero solo para las pruebas con base real. Las credenciales son de un contenedor
    # desechable que existe únicamente durante este trabajo; no son secretos del proyecto.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/h3ga_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm db:test:prepare
      - run: pnpm test
